[project]
name = "approvalflow-config"
version = "0.1.0"
description = "Config service: serves policy + autonomy thresholds, changeable without redeploy (F7/M13)"
requires-python = ">=3.12"
dependencies = [
    "approvalflow-shared",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["approvalflow_config*"]
