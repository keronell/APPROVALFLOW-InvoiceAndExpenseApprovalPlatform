[project]
name = "approvalflow-decision"
version = "0.1.0"
description = "Deterministic policy engine + router: the classifier proposes, the router decides (M12/F10)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "approvalflow-shared",
    "agent-framework>=1.10",
    "dapr>=1.15",
    "dapr-ext-workflow>=1.15",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["approvalflow_decision*"]
