[project]
name = "approvalflow-decision"
version = "0.1.0"
description = "Deterministic policy engine + router: the classifier proposes, the router decides (M12/F10)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "approvalflow-shared",
    # Deliberately NOT the agent-framework meta package: it expands to
    # agent-framework-core[all], whose beta/rc extras (github-copilot, ...)
    # make a fresh, unconstrained resolve backtrack until pip gives up
    # (resolution-too-deep). We only use core symbols + the OpenAI client.
    "agent-framework-core>=1.10,<1.11",
    "agent-framework-openai>=1.10,<1.11",
    "dapr>=1.15",
    "dapr-ext-workflow>=1.15",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["approvalflow_decision*"]
