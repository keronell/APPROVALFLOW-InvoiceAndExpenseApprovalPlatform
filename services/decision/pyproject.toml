[project]
name = "approvalflow-decision"
version = "0.1.0"
description = "Deterministic policy engine + router: the classifier proposes, the router decides (M12/F10)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "approvalflow-shared",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["approvalflow_decision*"]
