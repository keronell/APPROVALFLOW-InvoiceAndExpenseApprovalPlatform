[project]
name = "approvalflow-reporting"
version = "0.1.0"
description = "Reporting service: throughput/auto-vs-human metrics + audit trail per correlation id (F8/F9)"
requires-python = ">=3.12"
dependencies = [
    "approvalflow-shared",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["approvalflow_reporting*"]
