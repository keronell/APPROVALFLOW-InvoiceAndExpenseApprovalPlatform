# Root tooling configuration only — the installable code lives in services/*.

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["ui", "Documents", "Examples"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: tests that need docker compose infrastructure running",
]
