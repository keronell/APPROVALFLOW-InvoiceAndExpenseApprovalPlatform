# ApprovalFlow gateway — the single external entry point (M6).
# Serves the React UI and proxies /api/* to the owning service, with
# rate limiting and a correlation id on every proxied request (M14/F9).

worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # Rate limiting (M6): per client IP. 30 r/s steady, bursts absorbed.
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_status 429;

    # One correlation id end-to-end: reuse the caller's or mint from request id.
    map $http_x_correlation_id $corr_id {
        ""      $request_id;
        default $http_x_correlation_id;
    }

    server {
        listen 8080;

        # ------------------------------------------------------------- UI
        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }

        # --------------------------------------------------- API routing
        # Each prefix goes to the service that owns the resource.
        location /api/auth       { limit_req zone=api burst=60 nodelay; proxy_pass http://intake:8000;    include /etc/nginx/proxy_params.conf; }
        location /api/invoices   { limit_req zone=api burst=60 nodelay; proxy_pass http://intake:8000;    include /etc/nginx/proxy_params.conf; }
        location /api/approvals  { limit_req zone=api burst=60 nodelay; proxy_pass http://approval:8000;  include /etc/nginx/proxy_params.conf; }
        # NOTE: /api/decisions is deliberately NOT proxied. The decision API is a
        # Dapr-internal surface (approval delivers the human decision over service
        # invocation) and carries no role guard — exposing it would let anonymous
        # callers resolve a paused approval (N1 bypass).
        location /api/budgets    { limit_req zone=api burst=60 nodelay; proxy_pass http://payment:8000;   include /etc/nginx/proxy_params.conf; }
        location /api/payments   { limit_req zone=api burst=60 nodelay; proxy_pass http://payment:8000;   include /etc/nginx/proxy_params.conf; }
        location /api/reports    { limit_req zone=api burst=60 nodelay; proxy_pass http://reporting:8000; include /etc/nginx/proxy_params.conf; }
        location /api/notifications { limit_req zone=api burst=60 nodelay; proxy_pass http://notification:8000; include /etc/nginx/proxy_params.conf; }
        location /api/audit      { limit_req zone=api burst=60 nodelay; proxy_pass http://reporting:8000; include /etc/nginx/proxy_params.conf; }
        location /config         { limit_req zone=api burst=60 nodelay; proxy_pass http://config:8000;    include /etc/nginx/proxy_params.conf; }

        location /healthz { return 200 '{"status":"ok","service":"gateway"}'; add_header Content-Type application/json; }
    }
}
