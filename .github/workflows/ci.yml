# CI quality gates on every push (M16/M17) + compose-up verification (D5).
# On a green main, the publish job builds and pushes every deployable image
# to GHCR (N2) — no manual release step.

name: CI

on:
  push:
  pull_request:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests (pytest)
        run: pytest

  verify:
    # End-to-end verification (D5): the four journeys + anti-cheese guards,
    # against the whole stack, using the deterministic stub model.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify (docker compose + journeys)
        env:
          LLM_PROVIDER: stub
        run: python tools/verify.py --down

  publish:
    # CD (N2): once the CI quality gates pass on main, build and push every
    # deployable image to GHCR — no manual release step. PR-side image builds
    # are already exercised by the verify job (docker compose builds them all).
    needs: [quality-gates, verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: config
            dockerfile: services/config/Dockerfile
          - name: intake
            dockerfile: services/intake/Dockerfile
          - name: decision
            dockerfile: services/decision/Dockerfile
          - name: payment
            dockerfile: services/payment/Dockerfile
          - name: approval
            dockerfile: services/approval/Dockerfile
          - name: reporting
            dockerfile: services/reporting/Dockerfile
          - name: notification
            dockerfile: services/notification/Dockerfile
          - name: gateway
            dockerfile: gateway/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires a lowercase image name; the repo owner may not be.
      - name: Compute lowercase image owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/approvalflow-${{ matrix.name }}:latest
            ghcr.io/${{ steps.owner.outputs.owner }}/approvalflow-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
