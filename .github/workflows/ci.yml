# CI quality gates on every push (M16/M17).
# Later stages extend this with the compose-up verification job (D5).

name: CI

on:
  push:
  pull_request:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests (pytest)
        run: pytest

  verify:
    # End-to-end verification (D5): the four journeys + anti-cheese guards,
    # against the whole stack, using the deterministic stub model.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify (docker compose + journeys)
        env:
          LLM_PROVIDER: stub
        run: python tools/verify.py --down
