# ApprovalFlow — the whole system comes up with `docker compose up` (M4).
#
# Each application service runs alongside its own Dapr sidecar (daprd) that
# shares the service's network namespace (`network_mode: service:<svc>`), so the
# app reaches its sidecar at localhost:3500 and the sidecar reaches the app at
# localhost:8000.
#
# The gateway (8080) is the ONLY externally reachable entry point (M6). The
# per-service ports below are bound to 127.0.0.1 so they are reachable only from
# the host (for tools/verify.py's direct journeys and local debugging) — never
# from outside the machine, so nothing can bypass the gateway's rate limiting
# and correlation-id stamping. Services still reach each other over the compose
# network by name (e.g. the gateway proxies to `intake:8000`).
#
# LLM_PROVIDER defaults to `ollama` (real local model). CI and tools/verify.py
# bring the stack up with LLM_PROVIDER=stub for a hermetic, deterministic run.

name: approvalflow

x-dapr-sidecar: &dapr-sidecar
  image: daprio/daprd:1.18.0
  environment:
    RABBITMQ_CONNECTION_STRING: "amqp://${RABBITMQ_USER:-approvalflow}:${RABBITMQ_PASSWORD:-approvalflow-dev}@rabbitmq:5672"
  volumes:
    - ./dapr/components:/components
  depends_on:
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    placement:
      condition: service_started
    scheduler:
      condition: service_started

services:
  # ---------------------------------------------------------------- messaging
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-approvalflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-approvalflow-dev}
    ports:
      - "127.0.0.1:15672:15672" # management UI (demo/debugging)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------------ storage
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # -------------------------------------------------------------- dapr system
  placement:
    image: daprio/placement:1.18.0
    command: ["./placement", "--port", "50006"]

  scheduler:
    image: daprio/scheduler:1.18.0
    command: ["./scheduler", "--port", "50007", "--etcd-data-dir", "/data"]
    user: "0"
    volumes:
      - scheduler-data:/data

  # ----------------------------------------------------------------- local llm
  # Default live model. Not started by tools/verify.py (which uses the stub).
  ollama:
    image: ollama/ollama:latest
    entrypoint:
      - /bin/sh
      - -c
      - "ollama serve & sleep 3 && ollama pull ${OLLAMA_MODEL:-qwen2.5:3b}; wait"
    volumes:
      - ollama-data:/root/.ollama

  # -------------------------------------------------------------- config svc
  config:
    build:
      context: .
      dockerfile: services/config/Dockerfile
    environment:
      DAPR_HTTP_PORT: "3500"
      CONFIG_API_TOKEN: "${CONFIG_API_TOKEN:-approvalflow-dev-config-token}"
    ports:
      - "127.0.0.1:8003:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      redis:
        condition: service_healthy
  config-dapr:
    <<: *dapr-sidecar
    command:
      ["./daprd", "--app-id", "config", "--app-port", "8000",
       "--dapr-http-port", "3500", "--dapr-grpc-port", "50001",
       "--resources-path", "/components",
       "--placement-host-address", "placement:50006",
       "--scheduler-host-address", "scheduler:50007"]
    network_mode: "service:config"
    depends_on:
      config:
        condition: service_started

  # -------------------------------------------------------------- intake svc
  intake:
    build:
      context: .
      dockerfile: services/intake/Dockerfile
    environment:
      DAPR_HTTP_PORT: "3500"
      STORE_BACKEND: "dapr"
      PUBLISHER_BACKEND: "dapr"
      AUTH_SECRET: "${AUTH_SECRET:-approvalflow-dev-auth-secret}"
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  intake-dapr:
    <<: *dapr-sidecar
    command:
      ["./daprd", "--app-id", "intake", "--app-port", "8000",
       "--dapr-http-port", "3500", "--dapr-grpc-port", "50001",
       "--resources-path", "/components",
       "--placement-host-address", "placement:50006",
       "--scheduler-host-address", "scheduler:50007"]
    network_mode: "service:intake"
    depends_on:
      intake:
        condition: service_started

  # ------------------------------------------------------------- decision svc
  decision:
    build:
      context: .
      dockerfile: services/decision/Dockerfile
    environment:
      DAPR_HTTP_PORT: "3500"
      DAPR_GRPC_PORT: "50001"
      LLM_PROVIDER: "${LLM_PROVIDER:-ollama}"
      LLM_MODEL: "${LLM_MODEL:-qwen2.5:3b}"
      LLM_BASE_URL: "${LLM_BASE_URL:-http://ollama:11434/v1}"
      LLM_API_KEY: "${LLM_API_KEY:-ollama}"
    ports:
      - "127.0.0.1:8002:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  decision-dapr:
    <<: *dapr-sidecar
    command:
      ["./daprd", "--app-id", "decision", "--app-port", "8000",
       "--dapr-http-port", "3500", "--dapr-grpc-port", "50001",
       "--resources-path", "/components",
       "--placement-host-address", "placement:50006",
       "--scheduler-host-address", "scheduler:50007"]
    network_mode: "service:decision"
    depends_on:
      decision:
        condition: service_started

  # -------------------------------------------------------------- payment svc
  payment:
    build:
      context: .
      dockerfile: services/payment/Dockerfile
    environment:
      DAPR_HTTP_PORT: "3500"
      DAPR_GRPC_PORT: "50001"
      AUTH_SECRET: "${AUTH_SECRET:-approvalflow-dev-auth-secret}"
    ports:
      - "127.0.0.1:8004:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  payment-dapr:
    <<: *dapr-sidecar
    command:
      ["./daprd", "--app-id", "payment", "--app-port", "8000",
       "--dapr-http-port", "3500", "--dapr-grpc-port", "50001",
       "--resources-path", "/components",
       "--placement-host-address", "placement:50006",
       "--scheduler-host-address", "scheduler:50007"]
    network_mode: "service:payment"
    depends_on:
      payment:
        condition: service_started

  # ------------------------------------------------------------- approval svc
  approval:
    build:
      context: .
      dockerfile: services/approval/Dockerfile
    environment:
      DAPR_HTTP_PORT: "3500"
      AUTH_SECRET: "${AUTH_SECRET:-approvalflow-dev-auth-secret}"
    ports:
      - "127.0.0.1:8005:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  approval-dapr:
    <<: *dapr-sidecar
    command:
      ["./daprd", "--app-id", "approval", "--app-port", "8000",
       "--dapr-http-port", "3500", "--dapr-grpc-port", "50001",
       "--resources-path", "/components",
       "--placement-host-address", "placement:50006",
       "--scheduler-host-address", "scheduler:50007"]
    network_mode: "service:approval"
    depends_on:
      approval:
        condition: service_started

  # ------------------------------------------------------------ reporting svc
  reporting:
    build:
      context: .
      dockerfile: services/reporting/Dockerfile
    environment:
      DAPR_HTTP_PORT: "3500"
      AUTH_SECRET: "${AUTH_SECRET:-approvalflow-dev-auth-secret}"
    ports:
      - "127.0.0.1:8006:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  reporting-dapr:
    <<: *dapr-sidecar
    command:
      ["./daprd", "--app-id", "reporting", "--app-port", "8000",
       "--dapr-http-port", "3500", "--dapr-grpc-port", "50001",
       "--resources-path", "/components",
       "--placement-host-address", "placement:50006",
       "--scheduler-host-address", "scheduler:50007"]
    network_mode: "service:reporting"
    depends_on:
      reporting:
        condition: service_started

  # ---------------------------------------------------------- notification svc
  notification:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    environment:
      DAPR_HTTP_PORT: "3500"
      AUTH_SECRET: "${AUTH_SECRET:-approvalflow-dev-auth-secret}"
    ports:
      - "127.0.0.1:8007:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  notification-dapr:
    <<: *dapr-sidecar
    command:
      ["./daprd", "--app-id", "notification", "--app-port", "8000",
       "--dapr-http-port", "3500", "--dapr-grpc-port", "50001",
       "--resources-path", "/components",
       "--placement-host-address", "placement:50006",
       "--scheduler-host-address", "scheduler:50007"]
    network_mode: "service:notification"
    depends_on:
      notification:
        condition: service_started

  # ------------------------------------------------------------------ gateway
  # The single external entry point (M6): serves the UI, proxies the API,
  # rate-limits, and stamps a correlation id on every request.
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      intake:
        condition: service_started
      approval:
        condition: service_started
      reporting:
        condition: service_started

volumes:
  scheduler-data:
  ollama-data:
